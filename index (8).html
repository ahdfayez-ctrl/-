<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> ملاذ التنانين السحري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #070d08;
    --emerald-dark: #0e1a11;
    --parchment: #e6d3a7;
    --parchment-glow: #fff3cb;
    --gold: #c69b3f;
    --gold-bright: #f3d078;
    --fire-orange: #ff5500;
    --fire-glow: #ff8800;
    --ink: #1c130d;
    --font-title: 'Amiri', serif;
    --font-ui: 'Reem Kufi', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-dark);
    color: var(--parchment);
    font-family: var(--font-ui);
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
  }

  /* Video Background Layer */
  .video-container {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .bg-video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
  }

  .bg-video.active {
    opacity: 0.65;
  }

  .video-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 30%, rgba(7, 13, 8, 0.85) 90%);
    z-index: 1;
    pointer-events: none;
  }

  /* Story Overlay Mode */
  .story-viewport {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    text-align: center;
  }

  .story-card {
    background: rgba(14, 26, 17, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(198, 155, 63, 0.3);
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(198, 155, 63, 0.1);
    padding: 40px;
    max-width: 650px;
    border-radius: 4px;
    transform: translateY(20px);
    opacity: 0;
    animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
  }

  .story-title {
    font-family: var(--font-title);
    font-size: 2.8rem;
    color: var(--gold-bright);
    text-shadow: 0 0 15px rgba(243, 208, 120, 0.4);
    margin-bottom: 15px;
  }

  .story-desc {
    font-family: var(--font-title);
    font-size: 1.4rem;
    line-height: 1.9;
    color: var(--parchment-glow);
    margin-bottom: 30px;
  }

  .magic-btn {
    background: linear-gradient(135deg, #a63a00, var(--fire-orange));
    color: #fff;
    border: 1px solid var(--gold);
    padding: 14px 36px;
    font-size: 1.2rem;
    font-family: var(--font-ui);
    cursor: pointer;
    border-radius: 30px;
    box-shadow: 0 0 25px rgba(255, 85, 0, 0.5);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .magic-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px rgba(255, 136, 0, 0.8);
    background: linear-gradient(135deg, var(--fire-orange), var(--fire-glow));
  }

  /* Game Dashboard Phase (Hidden initially) */
  .game-dashboard {
    display: none;
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 30px 20px;
  }

  .dashboard-grid {
    display: grid;
    grid-template-columns: 300px 1fr 300px;
    gap: 20px;
    margin-top: 20px;
  }

  .panel {
    background: rgba(14, 26, 17, 0.85);
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: 20px;
    backdrop-filter: blur(10px);
  }

  .panel-header {
    font-family: var(--font-title);
    font-size: 1.6rem;
    color: var(--gold-bright);
    border-bottom: 1px solid rgba(198, 155, 63, 0.3);
    padding-bottom: 10px;
    margin-bottom: 15px;
    text-align: center;
  }

  .stat-bar {
    margin-bottom: 15px;
  }
  .stat-label { font-size: 0.9rem; margin-bottom: 5px; display: flex; justify-content: space-between; }
  .stat-track { height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden; border: 1px solid var(--gold); }
  .stat-fill { height: 100%; background: var(--fire-orange); width: 50%; transition: width 0.3s; }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <!-- Background Videos Sync Layer -->
  <div class="video-container">
    <!-- Replace with your exact video paths -->
    <video id="vid1" class="bg-video active" autoplay loop muted playsinline>
      <source src="video1.mp4" type="video/mp4">
    </video>
    <video id="vid2" class="bg-video" loop muted playsinline>
      <source src="video2.mp4" type="video/mp4">
    </video>
    <video id="vid3" class="bg-video" loop muted playsinline>
      <source src="video3.mp4" type="video/mp4">
    </video>
  </div>
  <div class="video-overlay"></div>

  <!-- Story Flow Viewport -->
  <div class="story-viewport" id="storyViewport">
    <div class="story-card" id="storyCard">
      <h1 class="story-title" id="storyTitle">أعماق الغابة الممنوعة</h1>
      <p class="story-desc" id="storyDesc">
        كنت تسير وحيداً بين الأشجار العتيقة والضباب يلف المكان... وفجأة شاردة هبطت عليك من السماء لتبدأ حكايتك.
      </p>
      <button class="magic-btn" id="nextStepBtn" onclick="nextStoryStep()">اقترب بحذر...</button>
    </div>
  </div>

  <script>
    let step = 0;
    const stories = [
      {
        title: "أعماق الغابة الممنوعة",
        desc: "كنت تسير وحيداً بين الأشجار العتيقة والضباب يلف المكان... وفجأة هبطت عليك شاردة نارية من بين الأغصان.",
        btn: "اقترب بحذر...",
        vid: "vid1"
      },
      {
        title: "اكتشاف البيضة السحرية",
        desc: "ارتطمت بالأرض أمامك بيضة غريبة النقوش، تنبض بضوء دافئ وسحري ينادي شجاعتك.",
        btn: "التقط البيضة بيدك...",
        vid: "vid2"
      },
      {
        title: "العهد الأبدي",
        desc: "بين يديك الآن أمانة تنين نادراً ما يراه بشر. احتضنها، وافتح لها أبواب العناية حتى تفقس!",
        btn: "ابدأ رحلة التدفئة والتربية 🐉",
        vid: "vid3"
      }
    ];

    function nextStoryStep() {
      step++;
      if(step < stories.length) {
        // Change text
        document.getElementById('storyTitle').innerText = stories[step].title;
        document.getElementById('storyDesc').innerText = stories[step].desc;
        document.getElementById('nextStepBtn').innerText = stories[step].btn;

        // Switch active video smoothly
        document.querySelectorAll('.bg-video').forEach(v => v.classList.remove('active'));
        const nextVid = document.getElementById(stories[step].vid);
        if(nextVid) {
          nextVid.classList.add('active');
          nextVid.play();
        }
      } else {
        // Transition to main game mode
        document.getElementById('storyViewport').style.display = 'none';
        alert("مبروك! لقد دخلت الآن نظام تربية التنين الخاص بك بكأس الإبداع!");
      }
    }
  </script>
</body>
</html>
